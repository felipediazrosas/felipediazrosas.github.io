<svg color="#6fa8ff" viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor">
  <g stroke-width="1.1" opacity="0.85">
    <!-- left platform -->
    <rect x="50" y="140" width="130" height="130" rx="10"/>
    <circle cx="115" cy="205" r="34" stroke-width="1"/>
    <line x1="95" y1="205" x2="135" y2="205" stroke-width="0.8" opacity="0.6"/>
    <line x1="115" y1="185" x2="115" y2="225" stroke-width="0.8" opacity="0.6"/>

    <!-- right platform -->
    <rect x="300" y="140" width="130" height="130" rx="10"/>
    <path d="M330 240 L365 175 L400 240 Z" stroke-width="1"/>
    <line x1="345" y1="220" x2="385" y2="220" stroke-width="0.8" opacity="0.6"/>

    <!-- bridge: parallel sync lines -->
    <g stroke-width="1" opacity="0.75">
      <line x1="180" y1="185" x2="300" y2="185"/>
      <line x1="180" y1="205" x2="300" y2="205"/>
      <line x1="180" y1="225" x2="300" y2="225"/>
    </g>
    <g stroke="none" opacity="0.85">
      <circle cx="240" cy="185" r="2.6" fill="currentColor"/>
      <circle cx="240" cy="205" r="2.6" fill="currentColor"/>
      <circle cx="240" cy="225" r="2.6" fill="currentColor"/>
    </g>

    <!-- identity node below, feeding both -->
    <path d="M115 270 V330 H365 V270" stroke-width="1" opacity="0.6"/>
    <circle cx="240" cy="330" r="5" opacity="0.8"/>
    <circle cx="240" cy="330" r="11" opacity="0.15"/>

    <!-- records node above -->
    <path d="M115 140 V95 H365 V140" stroke-width="1" opacity="0.6"/>
    <rect x="215" y="70" width="50" height="25" rx="3" opacity="0.7"/>
  </g>
</svg>
